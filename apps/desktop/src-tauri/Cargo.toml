[package]
name = "chemdraft"
version = "0.0.0"
description = "ChemDraft desktop shell"
authors = ["ChemDraft contributors"]
edition = "2021"

[lib]
name = "chemdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "objc2-app-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
