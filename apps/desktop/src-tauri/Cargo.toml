[package]
name = "chemdraft"
version = "1.0.0"
description = "ChemDraft desktop shell"
authors = ["ChemDraft contributors"]
edition = "2021"

[lib]
name = "chemdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
# Match tiny-skia 0.12.0's PNG decoder exactly when validating embedded picture headers.
png = "=0.18.1"
# resvg gates PNG decoding too behind raster-images; without it pasted pictures disappear.
resvg = { version = "0.47.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# The OCSR engine installer's downloads (uv, the MolScribe model). reqwest 0.12 is already in the
# graph through tauri-plugin-http. Feature unification gives BOTH clients OS + Mozilla roots.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
# Same version/provider already used by reqwest; typed TLS failure classification, no new crate.
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
# Existing locked transport: download diagnostics and the loopback assistant MCP server.
hyper = { version = "=1.10.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http = "=1.4.1"
http-body-util = "=0.1.3"
bytes = "=1.11.1"
tokio = { version = "=1.52.3", features = ["net", "io-util", "sync", "time", "macros"] }
getrandom = "=0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verifies every OCSR engine download before use; also the test-only check that the vendored OPSIN
# jar's bytes match the SHA-256 in its BUILD.md. Pinned to the version already in Cargo.lock.
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2.5.9"

# Off macOS, a second launch (e.g. double-clicking a document while ChemDraft runs) must hand its
# arguments to the running instance; macOS gets this from LaunchServices via RunEvent::Opened.
[target.'cfg(not(any(target_os = "macos", target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-single-instance = "2"

# Already in the graph through tauri/tao; used directly for window z-order checks, the clipboard, and
# the OCSR engine seam (free-disk query, CREATE_NO_WINDOW and junction relocation).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
] }

# The OCSR engine's process-group kill, waitid and statvfs; every use is behind cfg(unix).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# App updates on Windows (macOS keeps Sparkle; Linux has no release yet): signed manifest +
# NSIS installer, see docs/releasing/windows-updates.md.
[target.'cfg(windows)'.dependencies.tauri-plugin-updater]
version = "2.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSWindow", "NSEvent", "NSApplication", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString", "NSGeometry", "NSNotification", "NSOperation", "block2"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "objc2-app-kit"] }
tauri-plugin-sparkle-updater = "=0.2.4"
