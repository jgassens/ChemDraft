name: CI

# Every gate that used to be local-only. PR #26 merged 124 files with `mergeStateStatus: CLEAN`
# purely because the check set was empty — "clean" means "nothing failed", and nothing ran.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref. main is exempt: its runs are the record
# of what actually landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    name: Types, tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile so a PR that edits package.json without regenerating the lockfile fails
      # here rather than resolving to something nobody reviewed.
      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is `tsc -p tsconfig.json --noEmit`. It is the only thing that typechecks tests —
      # vitest does not — and it has already caught an invalid option in a test that ran green.
      - run: pnpm lint

      - run: pnpm vitest run

      # The Vite build, without the Tauri bundle: catches bundling and import errors that neither
      # tsc nor vitest sees, and needs no macOS runner. The Rust job builds this again because
      # tauri_build validates that `apps/desktop/dist` exists.
      - run: pnpm --filter @chemdraft/desktop build:web

  rust:
    name: Rust fmt, clippy, tests
    # macOS is the primary platform: it links objc2-app-kit / objc2-web-kit and the Sparkle updater
    # plugin (all macOS-gated in Cargo.toml). The `windows` job below covers the other side of every
    # cfg(target_os = "macos") gate.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build.rs -> tauri_build::try_build validates the configured frontendDist (`../dist`), which
      # is gitignored, so cargo cannot even compile without this.
      - run: pnpm --filter @chemdraft/desktop build:web
        env:
          # The macOS runner's default V8 heap (~2 GiB) is too small for this build since PR #219
          # added the plugin 3D chemistry worker. Measured locally: main ~2.42 GB peak RSS, #219
          # ~2.6 GB; a 2048 MiB heap OOMs. Allow 3 GiB on the 7 GB macOS runner, this step only.
          NODE_OPTIONS: --max-old-space-size=3072

      # Downloads the pinned, SHA-256-verified Sparkle release. build.rs skips staging when the
      # framework is absent, which leaves the test executables unable to link against it.
      - run: pnpm --filter @chemdraft/desktop prepare:sparkle

      # No toolchain action on purpose: rust-toolchain.toml is the single source of truth, so the
      # runner and a developer machine cannot disagree about which lints exist. `@stable` did
      # disagree — the runner had moved to 1.97 while this was written against 1.96, and clippy
      # failed here on code that was clean locally.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Formatting first: it needs no build, so a formatting-only failure reports in seconds instead
      # of after a full compile.
      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: cargo clippy --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      # 52 tests that no automated gate has ever run. `--locked` fails on a stale Cargo.lock rather
      # than silently resolving new versions.
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows:
    name: Windows types, tests, Rust
    # The Windows port: every non-macOS side of the Rust cfg gates, plus the whole TS suite on a
    # host where paths use backslashes, symlinks need privileges, and there is no bash or zip.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm vitest run

      # Also required by tauri_build (see the rust job). No Sparkle step: it is macOS-only.
      - run: pnpm --filter @chemdraft/desktop build:web

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: cargo clippy --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  linux:
    name: Linux Rust
    # The Linux port: the GTK/WebKitGTK side of every cfg gate (linux_clipboard.rs, the tooltip's
    # input shape), so a change that only builds on macOS and Windows cannot break the Linux release.
    # The TS suite already runs on Linux in the web job.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Also required by tauri_build (see the rust job).
      - run: pnpm --filter @chemdraft/desktop build:web
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: cargo clippy --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      # external_tools, naming_engine and ocsr_engine report themselves unsupported on Linux
      # (local_engine::platform has no Linux implementation yet), so their tests cannot run here.
      # Remove a --skip when its feature gains a Linux platform.
      - run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --
          --skip external_tools:: --skip naming_engine:: --skip ocsr_engine:: --skip engine3d_sidecar_

      # The 3D sidecar tests write a fake executable and then spawn it. On Linux a fork from a
      # parallel test can still hold that file open for writing, and exec fails with ETXTBSY
      # ("Text file busy"). One thread removes the race.
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml engine3d_sidecar_ -- --test-threads=1

  build-stamp:
    name: Build stamp bumped
    # PR-only: it compares against the base branch, and a push to main has already been decided.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: scripts/ci/require-build-stamp-bump.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
