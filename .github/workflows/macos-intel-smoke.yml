name: macOS Intel smoke (unsigned)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - native/avogadro3d-sidecar/**
      - apps/desktop/src-tauri/binaries/**
      - apps/desktop/src-tauri/tauri.intel.conf.json
      - apps/desktop/src-tauri/Info.intel.plist
      - apps/desktop/src-tauri/Info.plist
      - apps/desktop/src-tauri/tauri.conf.json
      - scripts/**
      - tools/release/**
      - run-app
      - rust-toolchain.toml
      - .github/workflows/macos-intel-smoke.yml

permissions:
  contents: read

concurrency:
  group: macos-intel-smoke-${{ github.ref }}
  cancel-in-progress: true

# Advisory smoke job; do not add it to branch protection's required checks.
# No release credentials or signing secrets. The fresh runner has no Developer ID identity.
jobs:
  intel-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      APPLE_SIGNING_IDENTITY: ''
      CHEMDRAFT_ENGINE3D_SIDECAR: apps/desktop/src-tauri/binaries/avogadro3d-sidecar-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Assert native Intel host
        run: test "$(uname -m)" = x86_64
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install the repository-pinned Rust toolchain and Intel target
        run: |
          rustup show
          rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: macos-intel-smoke-x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - run: pnpm install --frozen-lockfile
      - name: Tooling unit tests (no native compilation)
        run: node --test scripts/opsin-runtime-architecture.test.mjs scripts/macos-build-target.test.mjs tools/release/macos-release.test.mjs
      - name: Build Intel OPSIN runtime and smoke test benzene
        run: node scripts/build-opsin-runtime.mjs --arch x86_64
      - name: Inspect committed Intel sidecar
        id: sidecar
        shell: bash
        run: |
          if file -b "$CHEMDRAFT_ENGINE3D_SIDECAR" | grep -q 'Mach-O'; then
            echo 'real=true' >> "$GITHUB_OUTPUT"
          elif grep -q 'avogadro3d-sidecar placeholder' "$CHEMDRAFT_ENGINE3D_SIDECAR"; then
            echo 'real=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Intel sidecar is still a placeholder; skipping engine3d smokes. This run cannot establish release acceptance.'
          else
            echo '::error::Intel sidecar is neither Mach-O nor the known placeholder'
            exit 1
          fi
      - name: Smoke committed Intel sidecar (never rebuild it here)
        if: steps.sidecar.outputs.real == 'true'
        run: |
          pnpm smoke:engine3d-real-structure
          pnpm smoke:engine3d-hold-steady
          pnpm smoke:engine3d-anneal-energy
      - name: Build unsigned Intel app only (no DMG)
        env:
          # Stable resource/product layout for inspection; no stable app is installed or launched.
          CHEMDRAFT_STABLE_BUILD: '1'
          NODE_OPTIONS: --max-old-space-size=3072
        run: pnpm --filter @chemdraft/desktop build --target x86_64-apple-darwin --bundles app --ci
      - name: Inspect Intel app architecture, minimum OS, runtime and feed
        env:
          REAL_SIDECAR: ${{ steps.sidecar.outputs.real }}
        shell: bash
        run: |
          check_args=()
          if [ "$REAL_SIDECAR" = false ]; then check_args+=(--allow-sidecar-placeholder); fi
          node tools/release/verify-macos-app.mjs \
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ChemDraft.app \
            --target x86_64-apple-darwin "${check_args[@]}"
