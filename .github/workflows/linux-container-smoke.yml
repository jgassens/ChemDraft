name: Linux container smoke

on:
  pull_request:
    paths:
      - .github/workflows/linux-container-smoke.yml
      - .github/workflows/linux-release.yml
      - .github/workflows/linux-package-smoke/**
      - apps/desktop/src-tauri/src/**
      - apps/desktop/src/**
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock
      - .github/workflows/linux-build.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/binaries/avogadro3d-sidecar-x86_64-unknown-linux-gnu
      - scripts/build-opsin-runtime.mjs
      - scripts/desktop-tauri.mjs
      - tools/release/verify-bundle-licenses.mjs
      - tools/release/record-build.mjs
  workflow_call:
    inputs:
      artifact_run_id:
        description: Run ID for an artifact in this repository (omit for the same run)
        type: string
      artifact_name:
        description: Package artifact name (defaults to linux-release-amd64 with a run ID)
        type: string
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID of an existing Linux package artifact
        type: string
      artifact_name:
        description: Artifact name (use with a run ID, defaults to linux-release-amd64)
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: linux-container-smoke-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: inputs.artifact_run_id == '' && inputs.artifact_name == ''
    uses: ./.github/workflows/linux-build.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  smoke:
    needs: build
    if: >-
      always() && !cancelled() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && (inputs.artifact_run_id != '' || inputs.artifact_name != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 40 # Distro mirror package installation took up to 19 minutes on 2026-11-18.
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora]
        package: [appimage, deb]
        backend: [x11, wayland]
        native_wayland: ['0']
        include:
          - distro: debian
            image: debian:sid
          - distro: fedora
            image: fedora:latest
          - distro: arch
            image: archlinux:latest
            package: appimage
            backend: x11
            native_wayland: 0
          - distro: debian
            image: debian:sid
            package: deb
            backend: wayland
            native_wayland: '1'
          - distro: debian
            image: debian:sid
            package: appimage
            backend: wayland
            native_wayland: '1'
    container:
      image: ${{ matrix.image }}
      # strace needs ptrace and glycin's bubblewrap needs user namespaces.
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      DISTRO: ${{ matrix.distro }}
      PACKAGE: ${{ matrix.package }}
      BACKEND: ${{ matrix.backend }}
      NATIVE_WAYLAND: ${{ matrix.native_wayland }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name || 'linux-release-amd64' }}
          path: packages
          github-token: ${{ inputs.artifact_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}

      - name: Install host graphics libraries and smoke tools
        run: |
          set -euo pipefail
          mkdir -p smoke-logs
          exec > >(tee smoke-logs/setup.log) 2>&1
          shopt -s nullglob
          if [[ "$PACKAGE" == deb ]]; then
            bundles=("$GITHUB_WORKSPACE"/packages/*.deb)
          else
            bundles=("$GITHUB_WORKSPACE"/packages/*.AppImage)
          fi
          if [[ ${#bundles[@]} != 1 ]]; then
            echo "::error::Expected exactly one $PACKAGE in the artifact"
            exit 1
          fi

          if [[ "$DISTRO" == debian ]]; then
            apt-get update
            apt-get install -y --no-install-recommends \
              dbus-daemon passwd procps strace util-linux weston xwayland xvfb libgtk-3-0t64 libxdo3 \
              libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgpg-error0 \
              libwayland-client0 libwayland-egl1 libwayland-cursor0 libwayland-server0
            if [[ "$PACKAGE" == deb ]]; then
              apt-get install -y --no-install-recommends "${bundles[0]}"
            fi
          elif [[ "$DISTRO" == fedora ]]; then
            dnf install -y /usr/bin/dbus-run-session procps-ng shadow-utils strace util-linux weston xorg-x11-server-Xwayland xorg-x11-server-Xvfb \
              gtk3 libxdo mesa-dri-drivers mesa-libEGL libglvnd-egl libglvnd-glx libgpg-error \
              libwayland-client libwayland-egl libwayland-cursor libwayland-server
            if [[ "$PACKAGE" == deb ]]; then
              # Fedora exercises the payload against Fedora libraries. Debian tests apt install.
              dnf install -y /usr/bin/dpkg-deb webkit2gtk4.1
              dpkg-deb -x "${bundles[0]}" /
            fi
          else
            pacman -Syu --noconfirm --needed bash dbus procps-ng shadow strace util-linux \
              xorg-server-xvfb gtk3 xdotool mesa libglvnd libdrm libgpg-error wayland
          fi

          if [[ "$BACKEND" == x11 ]]; then
            case "$DISTRO" in
              debian)
                apt-get install -y --no-install-recommends at-spi2-core gir1.2-atspi-2.0 python3-gi \
                  fonts-dejavu-core imagemagick openbox x11-utils xclip xdotool
                ;;
              fedora)
                dnf install -y at-spi2-core python3-gobject-base dejavu-sans-fonts ImageMagick \
                  openbox /usr/bin/xdpyinfo /usr/bin/xprop xclip xdotool
                ;;
              arch)
                pacman -S --noconfirm --needed at-spi2-core python-gobject ttf-dejavu imagemagick \
                  openbox xorg-xdpyinfo xorg-xprop xclip
                ;;
            esac
          elif [[ "$NATIVE_WAYLAND" != 1 ]]; then
            # The toolbar field checks drive ChemDraft's XWayland windows in a Weston session and
            # in a virtual KWin session (Plasma's compositor, whose X window manager honors a
            # client's own focus request).
            case "$DISTRO" in
              debian)
                apt-get install -y --no-install-recommends at-spi2-core gir1.2-atspi-2.0 python3-gi \
                  fonts-dejavu-core x11-utils xclip xdotool kwin-wayland
                ;;
              fedora)
                dnf install -y at-spi2-core python3-gobject-base dejavu-sans-fonts /usr/bin/xprop \
                  xclip xdotool /usr/bin/kwin_wayland
                ;;
            esac
            if ! command -v kwin_wayland >/dev/null; then
              echo "::error::The $DISTRO KWin package did not install kwin_wayland"
              exit 1
            fi
            kwin_wayland --version || true
          fi

          if [[ "$PACKAGE" == appimage ]]; then
            chmod a+x "${bundles[0]}"
            echo "BUNDLE=${bundles[0]}" >> "$GITHUB_ENV"
          else
            echo 'BUNDLE=/usr/bin/chemdraft' >> "$GITHUB_ENV"
          fi
          useradd --create-home smoke
          install -d -m 1777 /tmp/.X11-unix

      - name: Check AppImage library resolution against host Mesa
        if: matrix.package == 'appimage'
        run: bash .github/workflows/linux-package-smoke/host-mesa.sh "$BUNDLE"

      # Xvfb also runs the document, menu and clipboard checks. Weston exercises the XWayland
      # default, the .deb's native Wayland opt-out, and the AppImage without XWayland. Both use
      # virtual displays without a GPU.
      - name: Smoke test the Linux package
        uses: ./.github/workflows/linux-package-smoke
        with:
          bundle: ${{ env.BUNDLE }}
          package: ${{ matrix.package }}
          backend: ${{ matrix.backend }}
          native-wayland: ${{ matrix.native_wayland }}
          logs: ${{ github.workspace }}/smoke-logs
          container-user: smoke
          check-window: ${{ matrix.backend == 'x11' }}

      # Both packages use XWayland in a Wayland session by default. Type into a floating
      # toolbar's number field there with a real click and keys, and require the document's
      # chemistry not to change. Weston cannot test click-to-focus: its X window manager resets
      # every client focus change and activates a window only on Wayland seat input, which
      # XTEST never reaches. So this step checks setup, accessibility and chemistry only, and
      # notes an unchanged field without failing. The KWin step below is the focus gate.
      # Native Wayland is not covered: Weston has no protocol that lets a test client type
      # into another client's window.
      - name: Type into a toolbar number field under Weston (no focus check)
        if: matrix.backend == 'wayland' && matrix.native_wayland != '1'
        run: |
          set -euo pipefail
          logs="$GITHUB_WORKSPACE/smoke-logs/toolbar-field"
          install -d -o smoke "$logs"
          runuser -u smoke -- env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 dbus-run-session -- \
            /usr/bin/python3 "$GITHUB_WORKSPACE/.github/workflows/linux-package-smoke/toolbar-field.py" \
            --compositor weston "$BUNDLE" "$PACKAGE" "$logs" 2>&1 | tee "$logs/harness.log"

      # The same check under a virtual KWin, the compositor of KDE Plasma. KWin's X window
      # manager honors a client's own focus request, so here the field must change: this is
      # the pass/fail check for click-to-focus in a toolbar number field. It clicks the
      # document first, as a user would, because ChemDraft (like Windows and macOS) gives a
      # field the keyboard only when ChemDraft had focus at the click. Its log prints
      # ChemDraft's "[palette-focus] linux-acquire" line for the click, which shows the app's
      # focus inputs (app-foreground=..., app-focus-lost=...), its decision (request=...),
      # the XSetInputFocus call and the outcome.
      - name: Type into a toolbar number field under KWin (focus check)
        if: >-
          !cancelled() && matrix.backend == 'wayland' && matrix.native_wayland != '1' &&
          (matrix.distro == 'debian' || matrix.distro == 'fedora')
        run: |
          set -euo pipefail
          logs="$GITHUB_WORKSPACE/smoke-logs/toolbar-field-kwin"
          install -d -o smoke "$logs"
          runuser -u smoke -- env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 dbus-run-session -- \
            /usr/bin/python3 "$GITHUB_WORKSPACE/.github/workflows/linux-package-smoke/toolbar-field.py" \
            --compositor kwin "$BUNDLE" "$PACKAGE" "$logs" 2>&1 | tee "$logs/harness.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-smoke-${{ matrix.distro }}-${{ matrix.package }}-${{ matrix.backend }}${{ matrix.native_wayland == '1' && '-native' || '' }}
          path: smoke-logs/
