name: Linux package build

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      upload_to_release:
        required: false
        type: string
    outputs:
      commit:
        value: ${{ jobs.build.outputs.commit }}
      version:
        value: ${{ jobs.build.outputs.version }}
      deb:
        value: ${{ jobs.build.outputs.deb }}
      appimage:
        value: ${{ jobs.build.outputs.appimage }}

permissions:
  contents: read

jobs:
  build:
    # No fork runs, PR events, fork checkouts, or credentials persisted in the checkout.
    if: github.repository == 'jgassens/ChemDraft' && !github.event.repository.fork
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # apt must never stop at a prompt (needrestart, debconf) on a release runner.
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.bundle.outputs.version }}
      deb: ${{ steps.bundle.outputs.deb-name }}
      appimage: ${{ steps.bundle.outputs.appimage-name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        id: source
        env:
          BUILD_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.upload_to_release }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if ! [[ "$BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            tag=${BUILD_REF#refs/tags/}
            git check-ref-format "refs/tags/$tag" || { echo '::error::ref must be a tag or full commit SHA.'; exit 1; }
            tag_sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}") || { echo '::error::ref must resolve to a repository tag.'; exit 1; }
            [ "$tag_sha" = "$sha" ] || { echo '::error::ref must resolve to a repository tag.'; exit 1; }
          fi
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ -n "$RELEASE_TAG" ]; then
            [ "$RELEASE_TAG" = "v$version" ] || { echo "::error::upload_to_release must be v$version (the app version)."; exit 1; }
            [ "$sha" = "$WORKFLOW_SHA" ] || { echo '::error::Build ref must match the workflow commit. Dispatch with --ref <release-tag>.'; exit 1; }
          fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Release source: $sha (version $version)"

      # The 3D sidecar is committed, as on macOS and Windows: .github/workflows/linux-sidecar-build.yml
      # builds it from the pinned sources and a maintainer commits it. Packaging never builds it or
      # writes over it; it checks that the committed file is that build (SHA-256 pinned in
      # scripts/engine3d-sidecar-linux.json), a native x86-64 ELF needing at most glibc 2.35, and
      # completes the protocol handshake. It fails while the pin is still pending. The sidecars in the
      # finished .deb and AppImage are checked against the same pin below.
      - name: Verify the committed x86_64 Linux 3D sidecar
        run: |
          set -euo pipefail
          node --version
          node scripts/audit-avogadro3d-sidecar.mjs
          node scripts/verify-committed-linux-sidecar.mjs

      # The Tauri Linux build set: WebKitGTK 4.1 for the webview, librsvg for icons, patchelf and
      # file for linuxdeploy (AppImage), xdg-utils so the bundled app can open links and mail.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf squashfs-tools xdg-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libssl-dev libxdo-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # rust-toolchain.toml is the single source of truth, as in the CI jobs.
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: linux-release-${{ matrix.arch }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21' # jlink --compress=zip-9 requires JDK 21+.
      - name: Build host-native OPSIN runtime and smoke test benzene
        run: node scripts/build-opsin-runtime.mjs

      # vite.config.ts stamps the footer "+dirty" from `git status --porcelain` while bundling, so a
      # release must start bundling from a clean tree. No earlier step writes to tracked files: the
      # sidecar is verified in place, pnpm installs from the frozen lockfile, and the OPSIN runtime
      # goes to the ignored resources/opsin/jre. Cargo.lock must already be current, or cargo would
      # rewrite it during the bundle build.
      - name: Check the source tree is clean before the bundle build
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > /dev/null
          dirty=$(git status --porcelain --untracked-files=normal)
          [ -z "$dirty" ] || { printf '::error::The source tree is dirty before the bundle build:\n%s\n' "$dirty"; exit 1; }

      - name: Build stable .deb and AppImage
        env:
          CHEMDRAFT_STABLE_BUILD: '1'
          # GitHub runners have no FUSE; linuxdeploy (itself an AppImage) must extract to run.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # linuxdeploy's bundled strip predates the .relr.dyn sections newer toolchains emit.
          NO_STRIP: 'true'
          # The Vite build of the whole editor needs more than Node's default heap (peak RSS near 4.8 GB).
          NODE_OPTIONS: --max-old-space-size=6144  # 16 GB runner
        # linuxdeploy resolves the dependencies of every ELF file in the AppDir, the bundled OPSIN
        # JRE included. Its libraries need libjvm.so from the JRE's lib/server, which they find at
        # run time through their own RUNPATH but linuxdeploy does not search: show it the folder.
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/apps/desktop/src-tauri/resources/opsin/jre/lib/server"
          pnpm --filter @chemdraft/desktop build --bundles deb,appimage

      # The release record refuses a dirty tree; the bundle build must not have written to it.
      - name: Check the source tree is still clean after the bundle build
        run: |
          set -euo pipefail
          dirty=$(git status --porcelain --untracked-files=normal)
          [ -z "$dirty" ] || { printf '::error::The source tree is dirty after the bundle build:\n%s\n' "$dirty"; exit 1; }

      - name: Verify stable bundle identity
        id: bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # tauri-build copies resource targets beside the release executable, as on Windows.
          node tools/release/verify-bundle-licenses.mjs apps/desktop/src-tauri/target/release || { echo '::error::Required bundled licences are missing from the release resource staging directory.'; exit 1; }
          conf=apps/desktop/src-tauri/tauri.conf.json
          version=$(node -p "require('./$conf').version")
          identifier=$(node -p "require('./$conf').identifier")
          product=$(node -p "require('./$conf').productName")
          [ "$identifier" = org.chemdraft.desktop ] && [ "$product" = ChemDraft ] || { echo '::error::Bundle has a development identity.'; exit 1; }
          # build.rs re-emits the worktree label into the native title; a release must have none.
          output=$(ls -t apps/desktop/src-tauri/target/release/build/chemdraft-*/output | head -n1)
          grep -qx 'cargo:rustc-env=CHEMDRAFT_WORKTREE_LABEL=' "$output" || { echo '::error::Native build has a worktree label.'; exit 1; }
          bundle=apps/desktop/src-tauri/target/release/bundle
          tauri_deb="$bundle/deb/ChemDraft_${version}_${ARCH}.deb"
          tauri_appimage="$bundle/appimage/ChemDraft_${version}_${ARCH}.AppImage"
          [ -f "$tauri_deb" ] || { echo "::error::Missing $tauri_deb"; exit 1; }
          [ -f "$tauri_appimage" ] || { echo "::error::Missing $tauri_appimage"; exit 1; }
          # A Linux build is a beta of its parent version, "<version>β". The files are named
          # ChemDraft_<version>-beta_<arch>.deb / .AppImage, and the .deb's control Version is
          # <version>~beta: Debian sorts "~" before the plain release, so the later <version> final
          # upgrades it. Tauri has no setting for the .deb Version short of changing the shared app
          # version, so rebuild the .deb from its own extracted tree with only that one control line
          # changed (files, modes and maintainer scripts as Tauri wrote them, owned by root), then
          # check the result below like any other .deb.
          deb="$bundle/deb/ChemDraft_${version}-beta_${ARCH}.deb"
          appimage="$bundle/appimage/ChemDraft_${version}-beta_${ARCH}.AppImage"
          deb_version="${version}~beta"
          repack=$(mktemp -d)
          dpkg-deb -R "$tauri_deb" "$repack/root"
          [ "$(grep -c '^Version: ' "$repack/root/DEBIAN/control")" = 1 ] || { echo "::error::$tauri_deb control lacks exactly one Version field."; exit 1; }
          sed -i -E "s/^Version: .*/Version: ${deb_version}/" "$repack/root/DEBIAN/control"
          dpkg-deb --root-owner-group -b "$repack/root" "$deb"
          rm -rf -- "$repack" "$tauri_deb"
          [ "$(dpkg-deb -f "$deb" Version)" = "$deb_version" ] || { echo "::error::$deb does not have Version $deb_version."; exit 1; }
          mv -- "$tauri_appimage" "$appimage"
          # The .deb must carry the 3D sidecar, the OPSIN runtime and the bundled licences, as the
          # other platforms do.
          # "mode path" per archive entry. dpkg-deb -c may or may not prefix paths with "./" (the
          # Tauri .deb does not), so strip it; a symlink or hard link line ends in "-> target" or
          # "link to target", so take the entry's own path, never the target.
          deb_listing() {
            dpkg-deb -c "$1" | awk '{ p = $NF; if ($(NF-1) == "->") p = $(NF-2); else if ($(NF-2) == "link" && $(NF-1) == "to") p = $(NF-3); sub(/^\.\//, "", p); print $1, p }'
          }
          listing=$(deb_listing "$deb")
          contents=$(awk '{ print $2 }' <<<"$listing")
          licences=$(node --input-type=module -e "import { requiredLicenseFiles } from './tools/release/required-license-files.mjs'; for (const { target } of requiredLicenseFiles) console.log('usr/lib/ChemDraft/' + target);")
          for path in usr/bin/chemdraft usr/bin/avogadro3d-sidecar usr/lib/ChemDraft/resources/opsin/jre/bin/java $licences; do
            grep -qxF "$path" <<<"$contents" || { echo "::error::$deb lacks $path"; exit 1; }
          done
          # Its sidecar must be the pinned build (scripts/engine3d-sidecar-linux.json) byte for byte,
          # never a placeholder, a regular file with mode 0755 (in the archive itself, before any
          # umask applies on extraction), and complete the handshake.
          # Exactly one entry at that path, and its mode string exactly -rwxr-xr-x: a symlink (l...),
          # a missing entry or a duplicate all fail.
          sidecar_entry=$(awk '$2 == "usr/bin/avogadro3d-sidecar" { print $1 }' <<<"$listing")
          [ "$sidecar_entry" = -rwxr-xr-x ] || { echo "::error::$deb holds usr/bin/avogadro3d-sidecar as '$sidecar_entry', not a regular file with mode 0755."; exit 1; }
          payload=$(mktemp -d)
          dpkg-deb -x "$deb" "$payload"
          node scripts/verify-committed-linux-sidecar.mjs --packaged "$payload/usr/bin/avogadro3d-sidecar" || { echo "::error::$deb does not carry the pinned 3D sidecar."; exit 1; }
          rm -rf -- "$payload"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "deb-name=$(basename "$deb")" >> "$GITHUB_OUTPUT"
          echo "appimage-name=$(basename "$appimage")" >> "$GITHUB_OUTPUT"

      - name: Repack AppImage with host runtimes, Mesa dependencies and GTK backend selection
        env:
          APPIMAGE: ${{ steps.bundle.outputs.appimage }}
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/$APPIMAGE"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          cd "$work"

          # A type 2 AppImage is its ELF runtime followed by SquashFS. Keep the runtime Tauri
          # supplied and replace the filesystem after linuxdeploy completes, without FUSE.
          offset=$("$image" --appimage-offset)
          [[ "$offset" =~ ^[1-9][0-9]*$ ]]
          "$image" --appimage-extract > original-extraction.log
          test -x squashfs-root/AppRun
          # Libraries the host must supply. Wayland and the compiler runtimes must match the host's
          # graphics stack. The rest are dependencies of host Mesa (libEGL_mesa, libgallium, libgbm,
          # the DRI drivers): linuxdeploy bundles the Ubuntu 22.04 copies, which then shadow the
          # host's newer ones when host Mesa loads inside the AppImage, a known cause of EGL
          # failures such as EGL_BAD_PARAMETER. Each is a standard base package on every supported
          # host: Ubuntu 22.04+ and Debian 12+ (libzstd1, libelf1, libffi8, libxau6, libxdmcp6,
          # libxcb-randr0, libxcb-shm0, libbsd0, libmd0), Fedora (libzstd, elfutils-libelf, libffi,
          # libXau, libXdmcp, libxcb, libbsd, libmd) and Arch (zstd, libelf, libffi, libxau,
          # libxdmcp, libxcb, libbsd, libmd). libxcb.so.1 itself stays bundled.
          host_libs=( -name 'libwayland-*' -o -name 'libstdc++.so*' -o -name 'libgcc_s.so*'
            -o -name 'libzstd.so*' -o -name 'libelf.so*' -o -name 'libelf-*.so' -o -name 'libffi.so*'
            -o -name 'libXau.so*' -o -name 'libXdmcp.so*' -o -name 'libxcb-randr.so*'
            -o -name 'libxcb-shm.so*' -o -name 'libbsd.so*' -o -name 'libmd.so*' )
          echo 'Graphics and host-supplied libraries in the original AppImage:'
          find squashfs-root \( "${host_libs[@]}" -o -name 'libEGL*.so*' -o -name 'libgbm.so*' \) -print
          find squashfs-root \( "${host_libs[@]}" \) -delete

          # Tauri copies the Jammy WebKitGTK 4.1 helpers into the original multiarch layout.
          appdir=squashfs-root
          multiarch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          webkit_dir="usr/lib/$multiarch/webkit2gtk-4.1"
          for helper in WebKitWebProcess WebKitNetworkProcess; do
            test -x "$appdir/$webkit_dir/$helper"
          done
          test -f "$appdir/$webkit_dir/injected-bundle/libwebkit2gtkinjectedbundle.so"
          gtk_hook="$appdir/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          # Keep the generated GTK settings and let ChemDraft choose the default backend.
          sed -i -E '/^[[:space:]]*export[[:space:]]+GDK_BACKEND=x11([[:space:]]|$)/d; /^[[:space:]]*export[[:space:]]+GIO_EXTRA_MODULES=/d' "$gtk_hook"
          cat >> "$gtk_hook" <<HOOK
          export WEBKIT_INJECTED_BUNDLE_PATH="\$APPDIR/$webkit_dir/injected-bundle"
          HOOK
          gio_dir="usr/lib/$multiarch/gio/modules"
          if [[ -d "$appdir/$gio_dir" ]]; then
            printf 'export GIO_EXTRA_MODULES="$APPDIR/%s"\n' "$gio_dir" >> "$gtk_hook"
          fi
          bash -n "$gtk_hook"

          # Ship the committed sidecar verified against the pin, not linuxdeploy's copy, which may have
          # had its RUNPATH rewritten (the sidecar needs no bundled library). Tauri put it here.
          sidecar="$appdir/usr/bin/avogadro3d-sidecar"
          test -f "$sidecar" || { echo '::error::The AppImage has no usr/bin/avogadro3d-sidecar.'; exit 1; }
          install -m 0755 -- "$GITHUB_WORKSPACE/apps/desktop/src-tauri/binaries/avogadro3d-sidecar-x86_64-unknown-linux-gnu" "$sidecar"

          # The AppImage runtime reads only zlib or zstd.
          mksquashfs squashfs-root app.squashfs -noappend -all-root -comp zstd -no-progress
          head -c "$offset" "$image" > repacked.AppImage
          cat app.squashfs >> repacked.AppImage
          chmod +x repacked.AppImage

          mkdir verify
          cd verify
          ../repacked.AppImage --appimage-extract > repacked-extraction.log
          test -x squashfs-root/AppRun
          # The shipped payload's sidecar must be the pinned build byte for byte and complete the handshake.
          node "$GITHUB_WORKSPACE/scripts/verify-committed-linux-sidecar.mjs" --packaged squashfs-root/usr/bin/avogadro3d-sidecar || { echo "::error::$APPIMAGE does not carry the pinned 3D sidecar."; exit 1; }
          echo 'Shared libraries under usr/lib in the repacked AppImage:'
          find squashfs-root/usr/lib \( -type f -o -type l \) \( -name '*.so' -o -name '*.so.*' \) -print | LC_ALL=C sort
          leftovers=$(find squashfs-root \( "${host_libs[@]}" \) -print)
          if [[ -n "$leftovers" ]]; then
            printf '::error::AppImage still contains host libraries\n%s\n' "$leftovers"
            exit 1
          fi
          graphics=$(find squashfs-root \( -name 'libEGL*' -o -name 'libGL.so*' -o -name 'libGLX*' \
            -o -name 'libOpenGL.so*' -o -name 'libGLESv1_CM.so*' -o -name 'libGLESv2.so*' -o -name 'libGLU.so*' \
            -o -name 'libGLdispatch*' -o -name 'libgbm*' -o -name 'libdrm*' -o -name 'libglapi*' \
            -o \( -name dri \( -type d -o -type l \) \) -o -name '*_dri.so' -o -name 'libvulkan*' \) \
            -print | LC_ALL=C sort)
          if [[ -n "$graphics" ]]; then
            printf '::error::AppImage bundles graphics libraries or drivers that must come from the host\n%s\n' "$graphics"
            exit 1
          fi
          mv ../repacked.AppImage "$image"

      - name: Record and stage the final packages
        env:
          DEB: ${{ steps.bundle.outputs.deb }}
          APPIMAGE: ${{ steps.bundle.outputs.appimage }}
        run: |
          set -euo pipefail
          node tools/release/record-build.mjs --artifact "$DEB" --target x86_64-unknown-linux-gnu
          node tools/release/record-build.mjs --artifact "$APPIMAGE" --target x86_64-unknown-linux-gnu
          mkdir -p release-assets
          cp "$DEB" "$DEB.build.json" "$APPIMAGE" "$APPIMAGE.build.json" release-assets/

      - name: Print SHA-256 and sizes and write checksums
        run: |
          set -euo pipefail
          cd release-assets
          ls -l
          sha256sum -- *.deb *.AppImage | tee SHA256SUMS-linux.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
